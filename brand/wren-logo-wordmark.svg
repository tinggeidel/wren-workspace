<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img">
  <title>Wren primary wordmark</title>
  <desc>Lowercase bold sans-serif wordmark reading "wren" with letter-spaced tagline "A SOFTER SCIENCE" beneath, set in espresso on a glaze field. Production face: PP Neue Montreal Bold (commercial) or Manrope 700 (free).</desc>
  <rect x="0" y="0" width="600" height="280" fill="#FBF7F0"/>
  <text x="300" y="170"
        text-anchor="middle"
        font-family="'PP Neue Montreal', 'Manrope', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="160"
        letter-spacing="-6"
        fill="#3B2F22">wren</text>
  <text x="300" y="220"
        text-anchor="middle"
        font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="11"
        letter-spacing="6"
        fill="#8A7B68">A  SOFTER  SCIENCE</text>
</svg>
